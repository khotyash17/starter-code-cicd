























































































name: Deploy Dist

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Install Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Print node version
        run: node -v

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test
